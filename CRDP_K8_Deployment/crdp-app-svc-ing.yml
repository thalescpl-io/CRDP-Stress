#
# Combined Kubernetes file for deploying CRDP across a multi-node, multi-pod environment
#
# SECTION:  Pod Deployment
#
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: crdp
  name: crdp-deployment
spec:
  template:
     metadata:
        name: crdp
        labels:
          run: crdp
     spec:
      containers:
        - image: thalesciphertrust/ciphertrust-restful-data-protection:latest
          imagePullPolicy: Always
          name: crdp-image
          env:
            - name: KEY_MANAGER_HOST
              value: "${KEY_MANAGER_HOST}"
            - name: SERVER_MODE
              value: "no-tls"
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: crdp-secret-name
                  key: regtoken
          ports:
            - containerPort: 8090
          # PERF: CRDP protect/reveal is CPU-bound (FPE tokenization). With no
          # requests the scheduler packs pods blindly and nodes plateaued at
          # ~80% under load; setting a request makes placement deterministic.
          # NOTE: no CPU limit is set on purpose so pods can burst into spare
          # cores -- the request governs placement, not the ceiling.
          #
          # SIZING: the request is a hard reservation. replicas x request must
          # fit in the cluster's allocatable CPU MINUS what system pods already
          # hold (CoreDNS, ingress-nginx, kube-proxy, node-exporter); if it does
          # not, the excess pods sit in Pending with "Insufficient cpu" forever.
          # Current setting: 250m x 6 pods = 1.5 cores reserved, sized to fit a
          # small cluster (a 2-core node included).
          #
          # On larger hardware, scale BOTH values back up together: the measured
          # optimum on a 3x16-core cluster was 1500m x 24 pods (36 cores of
          # requests, ~94% utilization), which reached that cluster's ~48-core
          # physical ceiling of ~650k protect cards/s. Verify headroom first:
          #   kubectl describe nodes | grep -A5 "Allocated resources"
          resources:
            requests:
              cpu: "250m"
      # PERF: keep replicas evenly balanced across all nodes. An unbalanced
      # spread (observed 24/16/8 when packing 48 pods) left a whole node at ~35%
      # while others saturated, wasting cores. ScheduleAnyway avoids blocking
      # rollout if a node is temporarily full.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              run: crdp
  # PERF: replica count must be sized to the cluster, in step with the CPU
  # request above (see the SIZING note there). 6 pods x 250m = 1.5 cores of
  # reservation, which schedules on small hardware.
  #
  # Core count is the throughput lever, not pod count: adding pods beyond
  # roughly 1 per 1.5-2 physical cores buys nothing (48 pods measured no faster
  # than 24 on the 3x16-core reference cluster). To scale up, add worker nodes
  # and then raise replicas to keep that ratio.
  replicas: 6
  selector:
      matchLabels:
        run: crdp

---
#
# SECTION:  Service Deployment
#
apiVersion: v1
kind: Service
metadata:
  labels:
    run: crdp
  name: crdp-service
spec:
  selector:
    run: crdp
  type: NodePort
  ports:
    - port: 8090
      nodePort: 32085

---
#
# SECTION:  Access Notes
#
# Default (load-balanced) access:
#   The default deployment path in makeSecretandDeploy.sh applies crdp-ingress.yml, which
#   exposes CRDP via host-based routing through the NGINX Ingress Controller at:
#     http://$CRDP_HOST   (auto-detected by the deploy script; see README "Configuration")
#   The Service above remains type: NodePort so that both the Ingress path and the direct
#   NodePort fallback can coexist without modification.
#
# Alternative (NodePort-only) access:
#   If the Ingress path is not used, the NodePort service above exposes CRDP directly at:
#     http://<any-node-ip>:32085
#   To use this path, comment out the "kubectl apply -f crdp-ingress.yml" line in
#   makeSecretandDeploy.sh.
#
